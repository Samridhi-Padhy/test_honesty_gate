name: CI Gate Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache step omitted since no requirements.txt exists

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff fastapi uvicorn

      - name: Run Ruff Linter
        run: |
          ruff check .
          ruff format --check .

      - name: Run Backend Unit Tests
        run: |
          # Run pytest with the backend directory in PYTHONPATH
          PYTHONPATH=backend python -m pytest backend/tests/ -v

      - name: Run Test-Honesty Gate Check
        run: |
          # Pass the PR ID to the gate, or "local" if not a PR
          export PR_ID="${{ github.event.pull_request.number || 'local' }}"
          python gate check $PR_ID
